version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  suggestion-api:
    build: ./suggestion-api
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
      PORT: 8082
    depends_on:
      db:
        condition: service_healthy

  pii-api:
    build: ./pii-api
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/postgres
      PORT: 8081
    depends_on:
      db:
        condition: service_healthy

  enrichment-api:
    build: ./enrichment-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
      PII_API_URL: http://pii-api:8081/pii
      SUGGESTION_API_URL: http://suggestion-api:8082/suggestions
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      suggestion-api:
        condition: service_started
      pii-api:
        condition: service_started
